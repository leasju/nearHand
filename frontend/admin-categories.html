<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Gestão de categorias da plataforma NearHand." />
  <title>NearHand — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin-page{width:min(720px,92vw);margin:36px auto 70px}
    .admin-page .panel-card + .panel-card{margin-top:16px}
    .category-row{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px}
    .category-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--surface);color:var(--ink)}
    #adminMessage{min-height:22px;color:var(--purple-dark);font-weight:600}
  </style>
  <script>
    (function () {
      var saved = localStorage.getItem("nearhand_theme");
      if (saved === "dark" || saved === "light") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="NearHand - início">
      <img src="img/logotype_nearhand.png" alt="NearHand" class="brand-logo" />
    </a>
    <div class="top-actions">
      <button class="icon-btn" id="themeToggleBtn" aria-label="Alternar tema escuro"><span id="themeToggleIcon">🌙</span></button>
      <button class="secondary-btn" id="adminLogoutBtn">Sair</button>
    </div>
  </header>

  <main>
    <div class="admin-page">
      <div class="page-title">
        <div><span class="eyebrow">ADMIN</span><h1>Categorias</h1></div>
      </div>

      <div class="panel-card">
        <div class="panel-head"><div><h2>Nova categoria</h2></div></div>
        <form id="categoryForm" class="ad-form settings-form">
          <input id="categoryNameInput" placeholder="Ex.: Jardinagem" required />
          <button class="primary-btn" type="submit">Criar categoria</button>
        </form>
        <p id="adminMessage"></p>
      </div>

      <div class="panel-card">
        <div class="panel-head"><div><h2>Categorias cadastradas</h2></div></div>
        <div id="categoryList"></div>
      </div>
    </div>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
