<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Login administrativo da plataforma NearHand." />
  <title>NearHand — Admin</title>
  <link rel="icon" type="image/png" href="img/icon_nearhand.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css?v=20260912-19" />
</head>
<body>
  <div class="blob-field" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="auth-shell">
    <aside class="auth-aside">
      <div class="brand-lockup">
        <img src="img/logotype_nearhand.png?v=20260912" alt="NearHand" class="brand-logo" />
      </div>

      <span class="badge-pill"><img class="icon" src="img/icons/icon-settings.png" alt="" /> Acesso restrito</span>

      <div class="hero-copy">
        <h1>Painel administrativo</h1>
        <p>Gerencie contas, anúncios, categorias e avaliações da plataforma NearHand.</p>
      </div>

      <ul class="check-list">
        <li><span class="check-ring"><img class="icon" src="img/icons/icon-check.png" alt="" /></span> Moderação de contas e anúncios</li>
        <li><span class="check-ring"><img class="icon" src="img/icons/icon-check.png" alt="" /></span> Gestão de categorias de serviço</li>
        <li><span class="check-ring"><img class="icon" src="img/icons/icon-check.png" alt="" /></span> Avaliações e denúncias</li>
      </ul>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-top">
          <div>
            <span class="eyebrow">Acesso</span>
            <h2>Entrar no painel</h2>
          </div>
        </div>

        <form id="adminLoginForm" class="auth-form" novalidate>
          <div class="field-group">
            <label class="field-label" for="adminEmail">Email</label>
            <input id="adminEmail" class="field-input" type="email" placeholder="Digite seu email" autocomplete="email" required />
          </div>

          <div class="field-group">
            <label class="field-label" for="adminPassword">Senha</label>
            <div class="password-wrap">
              <input id="adminPassword" class="field-input" type="password" placeholder="Digite sua senha" autocomplete="current-password" required />
              <button type="button" class="password-toggle" data-target="adminPassword"><img class="icon" src="img/icons/icon-visibility-off.png" alt="Mostrar senha" /></button>
            </div>
          </div>

          <button type="submit" class="primary-btn full">Entrar</button>

          <p class="bottom-copy">Não é administrador? <a class="inline-action" href="/auth?tipo=cliente&modo=login">Entrar como cliente</a> ou <a class="inline-action" href="/auth?tipo=prestador&modo=login">como prestador</a></p>
        </form>

        <p id="message"></p>
      </div>
    </main>
  </div>

  <script src="js/ripple.js?v=20260912"></script>
  <script src="js/admin.js"></script>
</body>
</html>
