<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Gestão de anúncios da plataforma NearHand." />
  <title>NearHand — Admin</title>
  <link rel="icon" type="image/png" href="img/icon_nearhand.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .admin-page{width:min(960px,92vw);margin:36px auto 70px}
    .admin-page .panel-card + .panel-card{margin-top:16px}
    .admin-nav{display:flex;gap:8px;margin-bottom:16px}
    .admin-service-row{display:grid;grid-template-columns:auto 56px 1fr auto auto auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin-top:8px}
    .admin-select{width:18px;height:18px;accent-color:var(--purple-dark)}
    .admin-service-thumb{width:56px;height:56px;border-radius:12px;background-size:cover;background-position:center;background-color:var(--tint)}
    #adminMessage{min-height:22px;color:var(--purple-dark);font-weight:600}
    #adminServiceSearch{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--surface);color:var(--ink);margin-bottom:10px}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin/home" aria-label="NearHand - início">
      <img src="img/logotype_nearhand.png" alt="NearHand" class="brand-logo" />
    </a>
    <div class="top-actions">
      <nav class="admin-tabs" aria-label="Navegação admin">
        <a class="admin-tab" href="/admin/home">Início</a>
        <a class="admin-tab" href="/admin/categories">Categorias</a>
        <a class="admin-tab active" href="/admin/anuncios">Anúncios</a>
        <a class="admin-tab" href="/admin/contas">Contas</a>
        <a class="admin-tab" href="/admin/avaliacoes">Avaliações</a>
      </nav>
      <button class="secondary-btn" id="adminLogoutBtn">Sair</button>
    </div>
  </header>

  <main>
    <div class="admin-page">
      <div class="page-title">
        <div><span class="eyebrow">ADMIN</span><h1>Anúncios</h1></div>
      </div>

      <div class="panel-card">
        <div class="panel-head"><div><h2>Todos os anúncios cadastrados</h2></div><button class="secondary-btn" id="removeSelectedServicesBtn" hidden><img class="icon" src="img/icons/icon-settings.png" alt="" /> Remover selecionados</button></div>
        <input id="adminServiceSearch" placeholder="Buscar por título ou prestador..." aria-label="Buscar anúncio" />
        <p id="adminMessage"></p>
        <div id="adminServiceList"></div>
      </div>
    </div>
  </main>

  <div class="modal-backdrop" id="editServiceModal" hidden>
    <div class="modal form-modal" role="dialog" aria-modal="true">
      <button class="modal-close" data-close="editServiceModal">×</button>
      <span class="eyebrow">ADMIN</span><h2>Editar anúncio</h2>
      <form id="editServiceForm" class="ad-form">
        <label>Título<input required id="editServiceTitle" /></label>
        <label>Categoria<select id="editServiceCategory"></select></label>
        <label>Descrição<textarea id="editServiceDescription" rows="4"></textarea></label>
        <div class="form-row">
          <label>Valor<input required id="editServicePrice" type="number" min="0" /></label>
          <label>Tipo<select id="editServicePriceType"><option value="por_hora">por hora</option><option value="fixo">por serviço</option></select></label>
        </div>
        <label class="checkbox-row"><input type="checkbox" id="editServiceNegotiable" /> Valor disposto a ser negociado</label>
        <label>Raio de atendimento <strong id="editServiceRadiusLabel">10 km</strong><input id="editServiceRadius" type="range" min="1" max="30" value="10" /></label>
        <label>Status
          <select id="editServiceStatus">
            <option value="ativo">Ativo</option>
            <option value="pausado">Pausado</option>
            <option value="removido">Removido</option>
          </select>
        </label>
        <button class="primary-btn full" type="submit">Salvar alterações</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/admin-services.js"></script>
</body>
</html>
